
<!doctype html>
<html lang="bn">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Payment UI</title>
  <style>
    body{
      margin:0;
      font-family: Arial, sans-serif;
      background:#f3f3f3;
      display:flex;
      justify-content:center;
    }
    .phone{
      width:280px;
      background:#fff;
      min-height:100vh;
      box-shadow:0 0 20px rgba(0,0,0,.08);
    }
    .topbar{
      background:#0f7f47;
      color:#fff;
      padding:10px 12px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      font-size:14px;
      font-weight:700;
    }
    .brand{font-size:14px;}
    .lang{
      font-size:10px;
      border:1px solid #fff;
      padding:2px 6px;
      border-radius:3px;
    }
    .content{padding:12px;}
    .notice{
      color:#d10000;
      font-size:12px;
      line-height:1.5;
      margin-bottom:10px;
    }
    .card{
      background:#d000a6;
      color:#fff;
      border-radius:6px;
      padding:12px;
      display:flex;
      align-items:center;
      gap:10px;
      margin-bottom:12px;
    }
    .avatar{
      width:34px;
      height:34px;
      border-radius:50%;
      background:#fff;
      color:#d000a6;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:10px;
      font-weight:700;
      flex:0 0 auto;
      overflow:hidden;
    }
    .avatar img{
      width:100%;
      height:100%;
      object-fit:cover;
      display:block;
    }
    .label{
      font-size:12px;
      margin-bottom:4px;
    }
    .field{margin:10px 0;}
    .input{
      width:100%;
      box-sizing:border-box;
      border:1px solid #ccc;
      border-radius:6px;
      padding:12px;
      font-size:12px;
      outline:none;
    }
    .numberBox{
      position:relative;
    }
    .copyBtn{
      position:absolute;
      right:6px;
      top:50%;
      transform:translateY(-50%);
      border:none;
      background:#e9f5ef;
      color:#0f7f47;
      padding:6px 8px;
      border-radius:5px;
      cursor:pointer;
      font-size:12px;
      font-weight:700;
    }
    .button{
      width:100%;
      border:1px solid #222;
      background:#fff;
      border-radius:8px;
      padding:12px;
      font-size:14px;
      font-weight:700;
      margin-top:8px;
      cursor:pointer;
    }
    .icons{
      display:flex;
      justify-content:space-between;
      gap:6px;
      margin:16px 0 8px;
      text-align:center;
      font-size:10px;
      color:#666;
    }
    .icon{
      flex:1;
      border:1px solid #eee;
      border-radius:8px;
      padding:10px 4px;
      background:#fafafa;
    }
    .icon.active{
      border:2px solid #d10000;
      background:#fff;
    }
    .timer{
      text-align:center;
      color:#d10000;
      font-weight:700;
      margin-top:10px;
      font-size:14px;
    }
    .timer small{
      display:block;
      color:#333;
      font-weight:400;
      margin-top:4px;
      font-size:11px;
    }
    .footer{
      font-size:9px;
      color:#999;
      line-height:1.4;
      margin-top:12px;
    }
  </style>
</head>
<body>
  <div class="phone">
    <div class="topbar">
      <div>BDT 500</div>
      <div class="brand">PAY SERVICE</div>
      <div class="lang">EN | বাংলা</div>
    </div>

    <div class="content">
      <div class="notice">
        আপনি যদি টাকা পাঠানোর পরিবর্তন করতে চান 500, আপনি নিচে লেখা ব্যবহার করতে হবে না।
      </div>

      <div class="card">
        <div class="avatar">
          <img src="images (2).png" alt="logo">
        </div>
        <div>
          <div class="label">বিকাশ Deposit</div>
        </div>
      </div>

      <div class="label">Wallet No*</div>
      <div style="font-size:13px;margin-bottom:8px;">এটি বিকাশ নাম্বার দেখুন যদি আপনি টাকা চান</div>

      <div class="field numberBox">
        <input class="input" id="walletNumber" type="text" value="01580987778" readonly />
        <button class="copyBtn" onclick="copyNumber()">কপি</button>
      </div>

      <div class="field">
        <input class="input" type="text" placeholder="ট্রানজেকশন আইডি" />
      </div>

      <button class="button">নিশ্চিত</button>

      <div class="icons">
        <div class="icon active">💰<br>পেমেন্ট</div>
        <div class="icon">📱<br>মোবাইল</div>
        <div class="icon">🤝<br>সহায়তা</div>
        <div class="icon">🛍️<br>সেবা</div>
      </div>

      <div class="timer">
        পেমেন্ট
        <small id="countdown">বাকি সময় 05:00</small>
      </div>

      <div class="footer">নোট: এটি একটি UI mockup.</div>
    </div>
  </div>

  <script>
    function copyNumber() {
      const number = document.getElementById("walletNumber").value;
      navigator.clipboard.writeText(number).then(() => {
        alert("নাম্বার কপি হয়েছে!");
      });
    }

    let timeLeft = 5 * 60;
    const countdownEl = document.getElementById("countdown");

    function updateTimer() {
      const minutes = Math.floor(timeLeft / 60);
      const seconds = timeLeft % 60;
      countdownEl.textContent =
        "বাকি সময় " +
        String(minutes).padStart(2, "0") + ":" +
        String(seconds).padStart(2, "0");

      if (timeLeft > 0) {
        timeLeft--;
        setTimeout(updateTimer, 1000);
      } else {
        countdownEl.textContent = "সময় শেষ";
      }
    }

    updateTimer();
  </script>
</body>
</html>
```
