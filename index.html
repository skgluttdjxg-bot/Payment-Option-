
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Page</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #F0F0F0; margin: 0; padding: 0; }
        .container { max-width: 500px; margin: 0 auto; background-color: #FFF0F5; min-height: 100vh; box-shadow: 0 0 10px rgba(0, 0, 0, 0.1); }
        .bonus-banner { background-color: #E91E63; color: #FFFFFF; text-align: center; padding: 12px 15px; font-size: 14px; font-weight: bold; line-height: 1.4; }
        header { background-color: #000000; color: #FFFFFF; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; }
        .logo-img { height: 45px; width: auto; object-fit: contain; }
        .service-link { color: #FFFFFF; font-size: 14px; text-decoration: underline; font-weight: bold; }
        .payment-system-text { font-size: 18px; font-weight: bold; }
        .lang-toggle { text-align: center; padding: 10px 0; font-size: 14px; }
        .lang-toggle a { color: #555; text-decoration: none; margin: 0 10px; }
        .send-money-prominent { font-size: 24px; font-weight: bold; color: #D32F2F; margin: 15px 20px; text-align: center; padding: 12px; border: 2px dashed #D32F2F; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .warning-box { background-color: #FCE4EC; border: 1px solid #F48FB1; padding: 15px; margin: 0 20px 20px 20px; border-radius: 6px; color: #C2185B; font-size: 14px; text-align: center; }
        .amount-selection { padding: 20px; text-align: center; }
        .custom-input { width: 100%; padding: 12px; font-size: 18px; font-weight: bold; border: 2px solid #E91E63; border-radius: 6px; box-sizing: border-box; text-align: center; margin-bottom: 15px; outline: none; }
        .amount-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 15px; }
        .amount-btn { background-color: #FAFAFA; border: 1px solid #CCCCCC; padding: 12px 0; cursor: pointer; border-radius: 4px; font-size: 15px; font-weight: bold; }
        .amount-btn:active { background-color: #E91E63; color: #FFFFFF; }
        .method-selection { padding: 0 20px 20px 20px; }
        .method-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .method-btn { padding: 15px; border-radius: 8px; cursor: pointer; font-size: 16px; font-weight: bold; text-align: center; border: 2px solid transparent; background-color: #FAFAFA; color: #333; }
        .method-btn.active { border-color: #E91E63; color: #E91E63; }
        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; font-size: 14px; font-weight: bold; margin-bottom: 5px; color: #666; }
        .input-group-row { display: flex; gap: 10px; align-items: center; }
        .input-group-row input { flex: 1; }
        .input-group input { width: 100%; padding: 12px; font-size: 16px; border: 1px solid #CCCCCC; border-radius: 6px; box-sizing: border-box; outline: none; }
        .copy-btn { background-color: #4CAF50; color: #FFFFFF; padding: 12px 16px; font-size: 14px; font-weight: bold; border: none; border-radius: 6px; cursor: pointer; }
        .submit-btn { width: 100%; background-color: #E91E63; color: #FFFFFF; padding: 15px; font-size: 18px; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; margin-top: 10px; }
    </style>
    <script>
        function setAmount(amount) {
            document.getElementById('amountInput').value = amount;
        }

        function selectMethod(methodName) {
            document.getElementById('bkashMethod').classList.remove('active');
            document.getElementById('nagadMethod').classList.remove('active');
            
            let walletLabel = document.getElementById('walletLabel');
            let walletInput = document.getElementById('walletInput');
            
            if (methodName === 'bKash') {
                document.getElementById('bkashMethod').classList.add('active');
                walletLabel.innerText = "bKash Wallet No*";
                walletInput.value = "01580987778";
            } else {
                document.getElementById('nagadMethod').classList.add('active');
                walletLabel.innerText = "Nagad Wallet No*";
                walletInput.value = "01614175872";
            }
        }

        function copyToClipboard() {
            let walletInput = document.getElementById('walletInput');
            walletInput.select();
            walletInput.setSelectionRange(0, 99999);
            try {
                navigator.clipboard.writeText(walletInput.value).then(() => {
                    alert("Copied: " + walletInput.value);
                });
            } catch (err) {
                document.execCommand('copy');
                alert("Copied: " + walletInput.value);
            }
        }
    </script>
</head>
<body>
    <div class="container">
        <div class="bonus-banner">
            The 300% bonus has been successfully activated. Please select your amount and complete the deposit.
        </div>
        <header>
            <span class="payment-system-text">PAYMENT SYSTEM</span>
            <img src="IMG_20261020_021205.png" alt="Logo" class="logo-img">
            <a href="#" class="service-link">SERVICE</a>
        </header>

        <div class="lang-toggle">
            <a href="#">EN</a> | <a href="#">BN</a>
        </div>

        <div class="send-money-prominent">
            SEND MONEY
        </div>

        <p style="text-align: center; margin-top: 20px; margin-bottom: 20px;">
            <span style="color: yellow; font-size: 32px; font-weight: bold; -webkit-text-stroke: 1px black;">👑Wj2.net 300%Bonus👑</span>
        </p>

        <div class="amount-selection">
            <div class="input-group">
                <label>Enter or select amount</label>
                <input type="text" id="amountInput" class="custom-input" placeholder="300" />
            </div>
            <div class="input-group" style="margin-bottom: 20px;">
                <input type="text" value="Minimum Deposit: 300" readonly style="color: #D32F2F; border: none; text-align: center; font-weight: bold; background-color: transparent;" />
            </div>
            <div class="amount-grid">
                <button class="amount-btn" onclick="setAmount('300')">300</button>
                <button class="amount-btn" onclick="setAmount('400')">400</button>
                <button class="amount-btn" onclick="setAmount('500')">500</button>
                <button class="amount-btn" onclick="setAmount('1000')">1000</button>
                <button class="amount-btn" onclick="setAmount('2000')">2000</button>
                <button class="amount-btn" onclick="setAmount('5000')">5000</button>
            </div>
        </div>

        <div class="warning-box">
            If you change the amount, you will not be able to receive the credit.
        </div>

        <div class="method-selection">
            <label>Select payment method:</label>
            <div class="method-grid" style="margin-top: 10px;">
                <button class="method-btn active" id="bkashMethod" onclick="selectMethod('bKash')">bKash</button>
                <button class="method-btn" id="nagadMethod" onclick="selectMethod('Nagad')">Nagad</button>
            </div>
        </div>

        <div style="padding: 0 20px 20px 20px;">
            <div class="input-group">
                <label id="walletLabel">bKash Wallet No*</label>
                <div class="input-group-row">
                    <input type="text" id="walletInput" value="01580987778" readonly />
                    <button class="copy-btn" onclick="copyToClipboard()">Copy</button>
                </div>
            </div>
            <div class="input-group">
                <label>TrxID Number (Required)</label>
                <input type="text" placeholder="Enter TrxID here!" />
            </div>
            <button class="submit-btn">Confirm</button>
        </div>
        
    </div>
</body>
</html>
